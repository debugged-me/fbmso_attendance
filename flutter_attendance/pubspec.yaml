name: flutter_attendance
description: "FBMSO Attendance — native mobile app (one app, many clients)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  image_picker: ^1.1.2
  phosphor_flutter: ^2.1.0
  path_provider: ^2.1.4
  flutter_svg: ^2.0.10+1
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  share_plus: ^12.0.2
  crypto: ^3.0.6
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/instrument-sans/InstrumentSans-Regular.ttf
        - asset: assets/fonts/instrument-sans/InstrumentSans-Italic.ttf
          style: italic

  assets:
    - assets/avatar.png
    - assets/img/icon-logo.png
    - assets/sounds/scan_success.wav
    - assets/sounds/scan_duplicate.wav
    - assets/sounds/scan_error.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/icon-logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/img/icon-logo.png"
